
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSAMC | نظام متابعة التأمين الطبي</title>
<style>
:root{--green:#00635e;--dark:#003d42;--bg:#eef3f8;--line:#dce5ee;--text:#172b3d}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:linear-gradient(160deg,#00645f,#003b40);color:white;padding:20px 12px}
.brand{font-size:18px;font-weight:bold;line-height:1.8;padding:12px;border-bottom:1px solid #ffffff35;margin-bottom:20px}
.brand small{display:block;font-size:11px;font-weight:normal}
.nav{display:block;width:100%;text-align:right;background:transparent;color:white;border:0;padding:14px;border-radius:9px;margin:5px 0}
.nav.active,.nav:hover{background:#0d8985}
.main{flex:1;min-width:0}
.header{background:linear-gradient(110deg,#006d68,#003f45);color:white;padding:25px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;margin:0}
.header p{margin:8px 0 0;font-size:12px}
.content{padding:20px;max-width:1500px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:17px}
.stat{border-radius:12px;padding:18px;background:white;border:1px solid var(--line)}
.stat strong{font-size:30px;display:block;margin-top:8px}
.blue{background:#e2efff}.orange{background:#fff0df}.purple{background:#eee8ff}.green{background:#dcf5e7}
.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #1231}
.panel h2{margin:0 0 16px;font-size:18px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.btn{border:0;border-radius:8px;background:var(--green);color:white;padding:11px 15px;font-weight:bold}
.btn.secondary{background:#eaf0f5;color:#263e4d;border:1px solid #d0dce6}
.btn.danger{background:#bf3535}
.btn.gold{background:#ffedbd;color:#694800}
.btn.small{padding:7px 10px;font-size:12px}
input,select,textarea{border:1px solid #cbd8e4;border-radius:8px;padding:11px;background:white;color:var(--text);width:100%}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:bold;font-size:12px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.full{grid-column:1/-1}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:12px 9px;text-align:right;border-bottom:1px solid #e2eaf0}
th{background:#eff5f8;font-size:12px}
.tablewrap{overflow:auto}
.pill{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:bold;background:#dceaff;color:#174ca0}
.pill.done{background:#d9f6e5;color:#087041}
.pill.late{background:#ffe0e0;color:#b02020}
.pill.wait{background:#fff0ce;color:#946000}
.pill.urgent{background:#ffe2d5;color:#a33d00}
.muted{font-size:12px;color:#697d8b}
.cards{display:none}
.casecard{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;background:white}
.casecard h3{margin:0 0 9px}
.casecard p{margin:7px 0}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:45px 10px;color:#71818d}
.modalback{position:fixed;inset:0;background:#001f2bbb;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:white;border-radius:15px;padding:20px;width:100%;max-width:800px;max-height:92vh;overflow:auto}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modalhead h2{margin:0}
.timeline{border-right:2px solid #a7dcd6;margin:15px 8px;padding-right:17px}
.event{position:relative;padding-bottom:18px}
.event:before{content:"";position:absolute;right:-24px;top:4px;width:11px;height:11px;background:#00827b;border-radius:50%}
.event p{white-space:pre-wrap}
.notice{padding:12px;border-radius:9px;background:#fff3d6;border:1px solid #eed38f;line-height:1.9;margin-bottom:15px}
.fab,.mobilebar{display:none}
.hidden{display:none!important}
.chartbar{height:13px;background:#e6eef2;border-radius:10px;overflow:hidden;margin:8px 0 17px}
.chartbar span{display:block;height:100%;background:#008079}
.attachment{padding:9px;border:1px solid var(--line);border-radius:8px;margin:7px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:950px){
.sidebar{width:175px}
.stats{grid-template-columns:repeat(2,1fr)}
.header h1{font-size:18px}
}
@media(max-width:700px){
.sidebar{display:none}
.header{padding:18px 14px}
.header h1{font-size:16px}
.content{padding:12px 12px 100px}
.stat{padding:13px}
.stat strong{font-size:25px}
.panel{padding:13px}
.formgrid{grid-template-columns:1fr}
.full{grid-column:auto}
.tablewrap{display:none}
.cards{display:block}
.mobilebar{display:flex;position:fixed;bottom:0;right:0;left:0;z-index:15;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 2px max(10px,env(safe-area-inset-bottom))}
.mobilebar button{background:none;border:0;color:#4a5b69;font-size:11px;display:flex;flex-direction:column;gap:5px;align-items:center}
.mobilebar b{font-size:23px}
.fab{display:block;position:fixed;left:18px;bottom:90px;border-radius:50%;width:56px;height:56px;font-size:28px;z-index:14;box-shadow:0 5px 20px #1235}
.modal{padding:15px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

const $=s=>document.querySelector(s);
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const now=()=>new Date().toISOString();
const dateText=d=>d?new Date(d).toLocaleString("ar-SA"):"—";
const days=d=>(Date.now()-new Date(d).getTime())/86400000;
const STORE="KSAMC_DEMO_V3";
let state={cases:[],settings:{lateHours:48}};
let page="home",search="",typeFilter="",statusFilter="",modalOpen=false;
let pendingFiles=[];
let saveTimer;

function load(){
try{
const raw=localStorage.getItem(STORE);
if(raw){
const obj=JSON.parse(raw);
if(Array.isArray(obj.cases))state=obj;
}
}catch(e){alert("تعذر قراءة البيانات المحفوظة");}
}
function save(){
try{
localStorage.setItem(STORE,JSON.stringify(state));
}catch(e){
alert("تعذر الحفظ. قد تكون مساحة التخزين ممتلئة. صدّر نسخة احتياطية ولا تغلق الصفحة.");
}
}
function activeCases(){return state.cases.filter(c=>c.status!=="تم الإنجاز")}
function late(c){return c.status!=="تم الإنجاز"&&days(c.created)*24>=Number(state.settings.lateHours||48)}
function statusLabel(c){return late(c)?"متأخرة":c.status}
function pill(c){
let cls=c.status==="تم الإنجاز"?"done":late(c)?"late":c.status.includes("انتظار")?"wait":"";
return `<span class="pill ${cls}">${escapeHTML(statusLabel(c))}</span>`;
}
function lastAction(c){return c.history?.length?c.history[c.history.length-1].text:"لا توجد تحديثات"}
function filtered(archive=false){
return state.cases.filter(c=>{
if(archive&&c.status!=="تم الإنجاز")return false;
if(!archive&&c.status==="تم الإنجاز")return false;
let text=[c.name,c.mrn,c.phone,c.document,c.type].join(" ").toLowerCase();
return (!search||text.includes(search.toLowerCase()))&&
(!typeFilter||c.type===typeFilter)&&
(!statusFilter||(statusFilter==="متأخرة"?late(c):c.status===statusFilter));
});
}
function stats(){
let all=state.cases;
return {total:all.length,active:activeCases().length,done:all.filter(c=>c.status==="تم الإنجاز").length,late:activeCases().filter(late).length};
}
function navButton(p,label,icon){
return `<button class="nav ${page===p?"active":""}" onclick="navigate('${p}')">${icon} &nbsp; ${label}</button>`;
}
function navigate(p){
page=p;search="";typeFilter="";statusFilter="";render();
window.scrollTo(0,0);
}
function render(){
let s=stats();
$("#root").innerHTML=`
<div class="app">
<aside class="sidebar">
<div class="brand">🏥 KSAMC
<small>مدينة الملك سلمان الطبية<br>تجمع المدينة المنورة الصحي</small></div>
${navButton("home","الرئيسية","⌂")}
<button class="nav" onclick="caseForm()">＋ &nbsp; إضافة معاملة</button>
${navButton("cases","متابعة المعاملات","☷")}
${navButton("archive","الأرشيف","▣")}
${navButton("reports","التقارير والمؤشرات","▥")}
${navButton("settings","الإعدادات والنسخ الاحتياطي","⚙")}
</aside>
<main class="main">
<header class="header">
<div><h1>نظام متابعة معاملات التأمين الطبي</h1>
<p>مدينة الملك سلمان الطبية | KSAMC | تجمع المدينة المنورة الصحي</p></div>
<div style="font-size:28px">🏥</div>
</header>
<div class="content">
${page==="home"||page==="cases"?`
<div class="stats">
<div class="stat blue">📋 إجمالي المعاملات<strong>${s.total}</strong></div>
<div class="stat orange">⚠️ معاملات متأخرة<strong>${s.late}</strong></div>
<div class="stat purple">◷ تحت المتابعة<strong>${s.active}</strong></div>
<div class="stat green">✓ تم الإنجاز<strong>${s.done}</strong></div>
</div>`:""}
<div id="pageContent"></div>
</div>
</main>
</div>
<button class="btn fab" onclick="caseForm()">＋</button>
<div class="mobilebar">
<button onclick="navigate('home')"><b>⌂</b>الرئيسية</button>
<button onclick="caseForm()"><b>＋</b>إضافة</button>
<button onclick="navigate('cases')"><b>☷</b>المعاملات</button>
<button onclick="navigate('archive')"><b>▣</b>الأرشيف</button>
<button onclick="navigate('reports')"><b>▥</b>المزيد</button>
</div>
<div id="modalRoot"></div>`;
if(page==="home"||page==="cases")renderCases(false);
if(page==="archive")renderCases(true);
if(page==="reports")renderReports();
if(page==="settings")renderSettings();
}
function caseActions(c){
return `<div class="actions">
<button class="btn small" onclick="details('${c.id}')">التفاصيل</button>
${c.status!=="تم الإنجاز"?`<button class="btn small" onclick="completeCase('${c.id}')">✓ إنجاز</button>`:""}
<button class="btn small gold" onclick="caseForm('${c.id}')">✎ تعديل</button>
<button class="btn small secondary" onclick="whatsapp('${c.id}')">واتساب</button>
</div>`;
}
function renderCases(archive){
let list=filtered(archive);
let title=archive?"الأرشيف — المعاملات المنجزة":"المعاملات النشطة";
let host=$("#pageContent");
host.innerHTML=`
<section class="panel">
<h2>${title} (${list.length})</h2>
<div class="toolbar">
<input id="searchBox" style="flex:2;min-width:180px" placeholder="بحث بالاسم أو رقم الملف أو الجوال" value="${escapeHTML(search)}">
<select id="typeBox" style="flex:1;min-width:140px">
<option value="">جميع أنواع الطلبات</option>
${["إدارية","طبية","حوادث وإصابات عمل"].map(t=>`<option ${typeFilter===t?"selected":""}>${t}</option>`).join("")}
</select>
<select id="statusBox" style="flex:1;min-width:140px">
<option value="">جميع الحالات</option>
${["تحت الإجراء","بانتظار رد التأمين","بانتظار القسم","متأخرة"].map(t=>`<option ${statusFilter===t?"selected":""}>${t}</option>`).join("")}
</select>
</div>
<div id="caseResults"></div>
</section>`;
$("#searchBox").oninput=e=>{search=e.target.value;drawCaseResults(archive)};
$("#typeBox").onchange=e=>{typeFilter=e.target.value;drawCaseResults(archive)};
$("#statusBox").onchange=e=>{statusFilter=e.target.value;drawCaseResults(archive)};
drawCaseResults(archive);
}
function drawCaseResults(archive){
let list=filtered(archive);
let target=$("#caseResults");
if(!list.length){target.innerHTML='<div class="empty">لا توجد معاملات في هذا القسم ✓</div>';return}
target.innerHTML=`
<div class="tablewrap"><table>
<thead><tr><th>المريض</th><th>MRN</th><th>نوع الطلب</th><th>المستند</th><th>الأولوية</th><th>الحالة</th><th>آخر إجراء</th><th>تاريخ الإدخال</th><th>الإجراءات</th></tr></thead>
<tbody>${list.map(c=>`<tr>
<td>${escapeHTML(c.name)}</td><td>${escapeHTML(c.mrn)}</td>
<td>${escapeHTML(c.type)}</td><td>${escapeHTML(c.document)}</td>
<td>${escapeHTML(c.priority)}</td><td>${pill(c)}</td>
<td>${escapeHTML(lastAction(c))}</td><td>${dateText(c.created)}</td>
<td>${caseActions(c)}</td></tr>`).join("")}</tbody>
</table></div>
<div class="cards">${list.map(c=>`
<div class="casecard">
<h3>${escapeHTML(c.name)}</h3>
<p class="muted">MRN: ${escapeHTML(c.mrn)}</p>
<p>📄 ${escapeHTML(c.document)}</p>
<p>نوع الطلب: ${escapeHTML(c.type)}</p>
<p>الأولوية: ${escapeHTML(c.priority)}</p>
<p>${pill(c)}</p>
<p><b>آخر إجراء:</b> ${escapeHTML(lastAction(c))}</p>
<p class="muted">${dateText(c.created)}</p>
${caseActions(c)}
</div>`).join("")}</div>`;
}
function showModal(title,body){
$("#modalRoot").innerHTML=`<div class="modalback" id="modalBack"><div class="modal">
<div class="modalhead"><h2>${title}</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div>
${body}</div></div>`;
modalOpen=true;
}
function closeModal(){
$("#modalRoot").innerHTML="";
modalOpen=false;
pendingFiles=[];
}
function caseForm(id=null){
let c=state.cases.find(x=>x.id===id);
pendingFiles=c?structuredClone(c.attachments||[]):[];
showModal(c?"تعديل المعاملة":"إضافة معاملة جديدة",`
<form id="caseForm">
<div class="formgrid">
<div class="field"><label>اسم المريض *</label><input name="name" required value="${escapeHTML(c?.name||"")}"></div>
<div class="field"><label>رقم الملف الطبي MRN *</label><input name="mrn" required value="${escapeHTML(c?.mrn||"")}"></div>
<div class="field"><label>رقم الجوال</label><input name="phone" inputmode="tel" value="${escapeHTML(c?.phone||"")}"></div>
<div class="field"><label>نوع الطلب *</label>
<select name="type">${["إدارية","طبية","حوادث وإصابات عمل"].map(t=>`<option ${c?.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
<div class="field"><label>المستند المطلوب *</label><input name="document" required value="${escapeHTML(c?.document||"")}"></div>
<div class="field"><label>الأولوية</label><select name="priority">
${["عادية","عاجلة","عاجلة جدًا"].map(t=>`<option ${c?.priority===t?"selected":""}>${t}</option>`).join("")}</select></div>
<div class="field"><label>الحالة</label><select name="status">
${["تحت الإجراء","بانتظار رد التأمين","بانتظار القسم","تم الإنجاز"].map(t=>`<option ${c?.status===t?"selected":""}>${t}</option>`).join("")}</select></div>
<div class="field"><label>تاريخ البريد الإلكتروني</label><input name="emailDate" type="date" value="${escapeHTML(c?.emailDate||"")}"></div>
<div class="field full"><label>الجهة المرسلة</label><input name="sender" value="${escapeHTML(c?.sender||"")}"></div>
<div class="field full"><label>ملاحظات الطلب</label><textarea name="notes">${escapeHTML(c?.notes||"")}</textarea></div>
<div class="field full">
<label>📷 تصوير البريد الإلكتروني أو إرفاق ملف</label>
<input id="filesInput" type="file" accept="image/*,application/pdf" multiple>
<div class="muted">يمكن اختيار صورة من الكاميرا أو المعرض. الحد التجريبي 2 ميجابايت لكل ملف.</div>
<div id="fileList"></div>
</div>
</div>
<div class="toolbar" style="margin-top:18px">
<button class="btn" type="submit">💾 حفظ المعاملة</button>
<button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button>
</div>
</form>`);
drawFiles();
$("#filesInput").onchange=async e=>{
for(const file of e.target.files){
if(file.size>2*1024*1024){alert("الملف أكبر من 2 ميجابايت");continue}
if(!["application/pdf"].includes(file.type)&&!file.type.startsWith("image/")){alert("نوع الملف غير مدعوم");continue}
const uri=await readFile(file);
pendingFiles.push({name:file.name,type:file.type,uri});
}
drawFiles();
};
$("#caseForm").onsubmit=e=>{e.preventDefault();saveCase(id,new FormData(e.target))};
}
function readFile(file){
return new Promise((resolve,reject)=>{
let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
});
}
function drawFiles(){
let el=$("#fileList");if(!el)return;
el.innerHTML=pendingFiles.map((f,i)=>`<div class="attachment">
<span>📎 ${escapeHTML(f.name)}</span>
<div class="actions">
<button type="button" class="btn small secondary" onclick="openAttachment(${i})">عرض</button>
<button type="button" class="btn small danger" onclick="removeAttachment(${i})">حذف</button>
</div></div>`).join("");
}
function openAttachment(i){
let f=pendingFiles[i];if(!f)return;
let a=document.createElement("a");a.href=f.uri;a.download=f.name;
document.body.appendChild(a);a.click();a.remove();
}
function removeAttachment(i){pendingFiles.splice(i,1);drawFiles()}
function saveCase(id,fd){
let v=Object.fromEntries(fd.entries());
v.name=v.name.trim();v.mrn=v.mrn.trim();v.document=v.document.trim();
if(!v.name||!v.mrn||!v.document)return alert("أكمل الحقول المطلوبة");
let duplicate=state.cases.find(c=>c.id!==id&&c.status!=="تم الإنجاز"&&c.mrn===v.mrn&&c.document.trim().toLowerCase()===v.document.toLowerCase());
if(duplicate&&!confirm("تنبيه: توجد معاملة نشطة مطابقة لرقم الملف والمستند. هل تريد المتابعة؟"))return;
let c=state.cases.find(x=>x.id===id);
if(c){
let oldStatus=c.status;
Object.assign(c,v,{attachments:pendingFiles});
c.history=c.history||[];
c.history.push({at:now(),text:oldStatus!==v.status?"تحديث الحالة من "+oldStatus+" إلى "+v.status:"تم تعديل بيانات المعاملة"});
if(v.status==="تم الإنجاز"&&!c.completed)c.completed=now();
if(v.status!=="تم الإنجاز")c.completed=null;
}else{
c={id:uid(),...v,created:now(),completed:v.status==="تم الإنجاز"?now():null,attachments:pendingFiles,history:[{at:now(),text:"تم إنشاء المعاملة"}]};
state.cases.unshift(c);
}
save();closeModal();render();
}
function details(id){
let c=state.cases.find(x=>x.id===id);if(!c)return;
showModal("تفاصيل المعاملة",`
<div class="formgrid">
<div><b>المريض:</b> ${escapeHTML(c.name)}</div>
<div><b>MRN:</b> ${escapeHTML(c.mrn)}</div>
<div><b>الجوال:</b> ${escapeHTML(c.phone)}</div>
<div><b>نوع الطلب:</b> ${escapeHTML(c.type)}</div>
<div><b>الأولوية:</b> ${escapeHTML(c.priority)}</div>
<div><b>الحالة:</b> ${pill(c)}</div>
<div class="full"><b>المستند:</b> ${escapeHTML(c.document)}</div>
<div class="full"><b>الملاحظات:</b> ${escapeHTML(c.notes||"—")}</div>
</div>
<h3>المرفقات</h3>
<div id="detailFiles"></div>
<h3>سجل تحديثات المعاملة</h3>
<div class="timeline">${(c.history||[]).map(h=>`<div class="event">
<small class="muted">${dateText(h.at)}</small><p>${escapeHTML(h.text)}</p></div>`).join("")}</div>
<div class="field"><label>إضافة تحديث جديد</label>
<textarea id="updateText" placeholder="اكتب آخر إجراء تم اتخاذه"></textarea></div>
<div class="toolbar" style="margin-top:12px">
<button class="btn" id="addUpdate">＋ حفظ التحديث</button>
<button class="btn secondary" onclick="caseForm('${id}')">تعديل المعاملة</button>
</div>`);
$("#detailFiles").innerHTML=(c.attachments||[]).map((f,i)=>`<div class="attachment">
${escapeHTML(f.name)} <button class="btn small secondary" data-file="${i}">تنزيل</button></div>`).join("")||'<p class="muted">لا توجد مرفقات</p>';
document.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>{
let f=c.attachments[Number(b.dataset.file)];
let a=document.createElement("a");a.href=f.uri;a.download=f.name;a.click();
});
$("#addUpdate").onclick=()=>{
let text=$("#updateText").value.trim();if(!text)return alert("اكتب التحديث");
c.history.push({at:now(),text});save();details(id);
};
}
function completeCase(id){
let c=state.cases.find(x=>x.id===id);if(!c)return;
if(!confirm("تأكيد إنجاز المعاملة ونقلها إلى الأرشيف؟"))return;
c.status="تم الإنجاز";c.completed=now();
c.history.push({at:now(),text:"تم إنجاز المعاملة"});
save();render();
}
function whatsapp(id){
let c=state.cases.find(x=>x.id===id);if(!c)return;
let messages={
document:"السلام عليكم، نأمل استكمال المستند المطلوب للمعاملة المشار إليها في المراسلات السابقة. شاكرين تعاونكم.",
follow:"السلام عليكم، نأمل إفادتنا بآخر مستجدات المعاملة المشار إليها في المراسلات السابقة. شكرًا لكم.",
done:"السلام عليكم، نفيدكم بأنه تم استكمال الإجراء المتعلق بالمعاملة المشار إليها في المراسلات السابقة."
};
showModal("قوالب رسائل واتساب",`
<div class="notice">راجع الرسالة قبل إرسالها. لا ترسل بيانات المريض أو رقم ملفه عبر قناة غير معتمدة من جهة العمل.</div>
<div class="field"><label>نوع الرسالة</label><select id="waType">
<option value="document">طلب استكمال مستند</option>
<option value="follow">متابعة معاملة</option>
<option value="done">إشعار الإنجاز</option>
</select></div>
<div class="field" style="margin-top:12px"><label>نص الرسالة</label><textarea id="waMessage"></textarea></div>
<div class="toolbar" style="margin-top:15px">
<button class="btn" id="sendWA">فتح واتساب</button>
<button class="btn secondary" id="copyWA">نسخ الرسالة</button>
</div>`);
function update(){ $("#waMessage").value=messages[$("#waType").value] }
$("#waType").onchange=update;update();
$("#copyWA").onclick=async()=>{
try{await navigator.clipboard.writeText($("#waMessage").value);alert("تم النسخ")}
catch(e){alert("تعذر النسخ")}
};
$("#sendWA").onclick=()=>{
let phone=(c.phone||"").replace(/\D/g,"");
if(phone.startsWith("0"))phone="966"+phone.slice(1);
if(!/^\d{9,15}$/.test(phone))return alert("رقم الجوال غير صالح");
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent($("#waMessage").value),"_blank","noopener,noreferrer");
};
}
function renderReports(){
let s=stats(),total=s.total||1;
let groups=[
["إدارية",state.cases.filter(c=>c.type==="إدارية").length],
["طبية",state.cases.filter(c=>c.type==="طبية").length],
["حوادث وإصابات عمل",state.cases.filter(c=>c.type==="حوادث وإصابات عمل").length]
];
let done=state.cases.filter(c=>c.completed);
let avg=done.length?done.reduce((n,c)=>n+(new Date(c.completed)-new Date(c.created))/86400000,0)/done.length:0;
$("#pageContent").innerHTML=`
<section class="panel"><h2>📊 لوحة مؤشرات الأداء</h2>
<div class="stats">
<div class="stat blue">الإجمالي<strong>${s.total}</strong></div>
<div class="stat orange">المتأخرة<strong>${s.late}</strong></div>
<div class="stat green">نسبة الإنجاز<strong>${Math.round(s.done/total*100)}%</strong></div>
<div class="stat purple">متوسط مدة الإنجاز<strong>${avg.toFixed(1)} يوم</strong></div>
</div>
<h3>المعاملات حسب النوع</h3>
${groups.map(([name,count])=>`<div>${name} — ${count}</div>
<div class="chartbar"><span style="width:${count/total*100}%"></span></div>`).join("")}
</section>
<section class="panel">
<h2>📗 تصدير Excel</h2>
<div class="formgrid">
<div class="field"><label>نطاق التقرير</label><select id="exportScope">
<option value="all">جميع المعاملات</option>
<option value="active">النشطة فقط</option>
<option value="done">المنجزة فقط</option>
<option value="filtered">نتائج التصفية الحالية للمعاملات النشطة</option>
</select></div>
<div class="field"><label>نوع التقرير</label><input value="المعاملات + الإحصائيات + سجل التحديثات" disabled></div>
</div>
<p class="muted">التقرير بصيغة Excel XML القديمة (.xls)، وليس XLSX. يتضمن أوراقًا متعددة وعناوين ملونة.</p>
<button class="btn" onclick="exportExcel()">📥 تصدير تقرير Excel</button>
</section>`;
}
function excelEscape(v){
return escapeHTML(String(v??"")).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
}
function sheet(name,headers,rows){
let cell=(v,style="normal")=>`<Cell ss:StyleID="${style}"><Data ss:Type="String">${excelEscape(v)}</Data></Cell>`;
return `<Worksheet ss:Name="${name}"><Table>
<Row>${headers.map(h=>cell(h,"head")).join("")}</Row>
${rows.map((r,i)=>`<Row>${r.map(v=>cell(v,i%2?"alt":"normal")).join("")}</Row>`).join("")}
</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions></Worksheet>`;
}
function exportExcel(){
let scope=$("#exportScope").value;
let arr=state.cases.filter(c=>scope==="all"||
scope==="active"&&c.status!=="تم الإنجاز"||
scope==="done"&&c.status==="تم الإنجاز"||
scope==="filtered"&&filtered(false).some(x=>x.id===c.id));
let rows=arr.map((c,i)=>[
i+1,c.name,c.mrn,c.phone,c.type,c.document,c.priority,statusLabel(c),
dateText(c.created),dateText(c.completed),lastAction(c)
]);
let summary=[
["تاريخ التقرير",dateText(now())],
["إجمالي المعاملات",arr.length],
["المنجزة",arr.filter(c=>c.status==="تم الإنجاز").length],
["النشطة",arr.filter(c=>c.status!=="تم الإنجاز").length],
["المتأخرة",arr.filter(late).length]
];
let history=arr.flatMap(c=>(c.history||[]).map(h=>[c.mrn,c.name,dateText(h.at),h.text]));
let xml=`<?xml version="1.0" encoding="UTF-8"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
<Style ss:ID="normal"><Alignment ss:Horizontal="Right"/><Font ss:FontName="Tahoma" ss:Size="10"/></Style>
<Style ss:ID="alt"><Interior ss:Color="#EAF4F5" ss:Pattern="Solid"/><Alignment ss:Horizontal="Right"/></Style>
<Style ss:ID="head"><Font ss:FontName="Tahoma" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#00635E" ss:Pattern="Solid"/><Alignment ss:Horizontal="Right"/></Style>
</Styles>
${sheet("المعاملات",["#","اسم المريض","MRN","الجوال","نوع الطلب","المستند","الأولوية","الحالة","تاريخ الإدخال","تاريخ الإنجاز","آخر إجراء"],rows)}
${sheet("الإحصائيات",["المؤشر","القيمة"],summary)}
${sheet("سجل التحديثات",["MRN","المريض","التاريخ","التحديث"],history)}
</Workbook>`;
download("KSAMC-Report-"+new Date().toISOString().slice(0,10)+".xls",
new Blob(["\ufeff",xml],{type:"application/vnd.ms-excel;charset=utf-8"}));
}
function download(name,blob){
let url=URL.createObjectURL(blob);
let a=document.createElement("a");a.href=url;a.download=name;
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function renderSettings(){
$("#pageContent").innerHTML=`
<section class="panel">
<h2>⚙️ إعدادات النظام</h2>
<div class="field"><label>اعتبار المعاملة متأخرة بعد عدد ساعات</label>
<input id="lateHours" type="number" min="1" value="${state.settings.lateHours||48}" style="max-width:200px"></div>
<div class="toolbar" style="margin-top:15px"><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div>
</section>
<section class="panel">
<h2>🔐 النسخ الاحتياطي واستعادة البيانات</h2>
<div class="notice">
هذه النسخة تحفظ البيانات في متصفح الجهاز فقط دون تشفير أو صلاحيات دخول.
لا تستخدم بيانات مرضى حقيقية. النسخ الاحتياطية تحتوي على البيانات والمرفقات ويجب حفظها في مكان آمن.
</div>
<div class="toolbar">
<button class="btn" onclick="backup()">تنزيل نسخة احتياطية JSON</button>
<label class="btn secondary" style="cursor:pointer">استعادة نسخة
<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)">
</label>
</div>
</section>`;
}
function saveSettings(){
let n=Number($("#lateHours").value);
if(!Number.isFinite(n)||n<1)return alert("أدخل عدد ساعات صحيح");
state.settings.lateHours=n;save();render();alert("تم الحفظ");
}
function backup(){
download("KSAMC-DEMO-BACKUP-"+new Date().toISOString().slice(0,10)+".json",
new Blob([JSON.stringify({format:"KSAMC-DEMO-3",created:now(),data:state},null,2)],{type:"application/json"}));
}
async function restoreBackup(e){
let f=e.target.files[0];e.target.value="";if(!f)return;
try{
let obj=JSON.parse(await f.text());
if(obj.format!=="KSAMC-DEMO-3"||!Array.isArray(obj.data?.cases))throw Error("invalid");
if(!confirm("سيتم استبدال جميع البيانات الحالية. هل تريد المتابعة؟"))return;
state=obj.data;save();render();alert("تمت الاستعادة");
}catch(err){alert("النسخة الاحتياطية غير صالحة أو تعذر استعادتها")}
}
load();
render();
</script>
</body>
</html>
