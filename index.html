<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005b59"><title>KSAMC | متابعة معاملات التأمين الطبي</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#142c39;background:#eef3f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:flex;min-height:100vh}.side{width:225px;background:linear-gradient(170deg,#00635f,#003c41);color:#fff;padding:20px 12px;flex-shrink:0}.brand{font-size:17px;font-weight:800;padding:13px 8px 24px;border-bottom:1px solid #ffffff30}.brand small{display:block;font-size:11px;margin-top:7px;line-height:1.8;font-weight:400}.nav{width:100%;display:flex;gap:10px;align-items:center;text-align:right;background:transparent;border:0;color:#fff;padding:14px 12px;border-radius:9px;margin-top:6px}.nav.active,.nav:hover{background:#0d8b89}.main{flex:1;min-width:0}.top{background:linear-gradient(100deg,#006b68,#003e45);color:white;padding:24px 30px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:22px}.top p{margin:8px 0 0;color:#d3f4f0}.content{padding:22px;max-width:1600px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:19px;border-radius:12px;background:white;border:1px solid #dce7f0;box-shadow:0 2px 8px #1232}.stat strong{font-size:30px;display:block;margin-top:7px}.stat.blue{background:#e5f1ff}.stat.orange{background:#fff0de}.stat.purple{background:#eee8ff}.stat.green{background:#def6e9}.panel{background:#fff;border:1px solid #dbe5ed;border-radius:13px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1830470a}.panel h2{margin:0 0 15px;font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-weight:700;font-size:12px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #cbd9e5;background:#fff;border-radius:8px;padding:11px;width:100%;color:#183140}.field textarea{resize:vertical;min-height:75px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.wide{grid-column:span 2}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:11px 16px;background:#006a64;color:white;font-weight:700}.btn.secondary{background:#eaf0f6;color:#193a48;border:1px solid #ccd8e2}.btn.warn{background:#c63c30}.btn.gold{background:#fff0c5;color:#72500a}.btn.tiny{padding:7px 10px;font-size:12px}.muted{color:#627786;font-size:12px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#e5efff;color:#1855a5}.pill.done{background:#d8f7e5;color:#07643b}.pill.late{background:#ffe1e1;color:#b52323}.pill.wait{background:#fff0d2;color:#8a5900}.pill.urgent{background:#ffe4d6;color:#a83a00}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 10px;text-align:right;border-bottom:1px solid #e2eaf0;vertical-align:middle}th{background:#f2f6fa;white-space:nowrap;font-size:12px}tr:hover td{background:#f8fbff}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:45px;color:#657c8d}.cards{display:none}.casecard{padding:15px;border:1px solid #dbe6ed;border-radius:12px;background:#fff;margin-bottom:10px}.casecard h3{margin:0 0 8px}.casecard p{margin:7px 0}.timeline{border-right:2px solid #a5dad5;padding-right:16px;margin:14px 8px}.event{position:relative;padding:0 0 18px}.event:before{content:'';position:absolute;right:-23px;top:3px;width:11px;height:11px;background:#007d77;border-radius:50%}.event small{color:#6d8290}.event p{margin:6px 0;white-space:pre-wrap}.modalback{position:fixed;inset:0;background:#001d2ab0;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:15px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.x{border:0;background:#eef3f6;border-radius:7px;padding:7px 12px}.fab{display:none}.notice{background:#fff5d9;border:1px solid #efd18d;padding:12px;border-radius:9px;line-height:1.8;margin-bottom:16px}.ok{background:#e4f7ed;border-color:#b7e3c7}.attachment{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid #dce5ec;border-radius:8px;margin:6px 0;flex-wrap:wrap}.hidden{display:none!important}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chartbar{height:12px;border-radius:8px;background:#e7eef4;overflow:hidden;margin:7px 0 14px}.chartbar span{height:100%;display:block;background:#007a72}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#003d45,#08736d);padding:16px}.loginbox{background:white;padding:30px;border-radius:16px;max-width:460px;width:100%;box-shadow:0 10px 35px #002b3a55}.loginbox h1{font-size:23px;margin-top:0}.loginbox .field{margin:15px 0}.loginbox button{width:100%}.loginbox p{line-height:1.9}.mobilebar{display:none}.filehint{font-size:12px;color:#687c89}.badgecount{background:#c43127;color:white;border-radius:20px;padding:3px 7px;font-size:11px}.topactions{display:flex;gap:8px}.selectcheck{display:flex;gap:8px;align-items:center}.selectcheck input{width:auto}.chartrow{margin-bottom:8px}.chartrow>div:first-child{display:flex;justify-content:space-between}
@media(max-width:1000px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.side{width:180px}.top h1{font-size:18px}}@media(max-width:700px){.side{display:none}.top{padding:18px 16px}.top h1{font-size:16px}.top p{font-size:11px}.content{padding:12px 12px 100px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:26px}.panel{padding:13px}.formgrid,.split{grid-template-columns:1fr}.wide{grid-column:auto}.tablewrap{display:none}.cards{display:block}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5eb;z-index:9;justify-content:space-around;padding:8px 3px max(10px,env(safe-area-inset-bottom))}.mobilebar button{background:none;border:0;color:#415565;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}.mobilebar button.active{color:#00655e;font-weight:800}.mobilebar b{font-size:23px}.fab{display:block;position:fixed;bottom:88px;left:17px;border-radius:50%;height:56px;width:56px;font-size:28px;box-shadow:0 6px 20px #1235;z-index:8}.modal{padding:15px}.topactions .btn{padding:8px;font-size:11px}}

<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB='ksacm-secure-v2', STORE='vault';let db=null, key=null, salt=null, data={cases:[],settings:{lateHours:48}}, current='home', filter='', filterType='', filterStatus='', editId=null, tempFiles=[], unlocked=false, passphrase='', saveQueue=Promise.resolve();
const now=()=>new Date().toISOString(),fmt=s=>s?new Date(s).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}):'—',hours=s=>(Date.now()-new Date(s).getTime())/36e5;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function dbGet(k){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readonly').objectStore(STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
function dbSet(k,v){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
const b64=b=>{let a=new Uint8Array(b),parts=[];for(let i=0;i<a.length;i+=8192)parts.push(String.fromCharCode(...a.subarray(i,i+8192)));return btoa(parts.join(''))}, un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,s){let raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:un64(s),iterations:250000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj,k){let iv=crypto.getRandomValues(new Uint8Array(12));let bytes=new TextEncoder().encode(JSON.stringify(obj));let enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes);return {iv:b64(iv),cipher:b64(enc)}}
async function decrypt(rec,k){let bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(rec.iv)},k,un64(rec.cipher));return JSON.parse(new TextDecoder().decode(bytes))}
function persist(){const snapshot=structuredClone(data);saveQueue=saveQueue.then(async()=>{if(!window.cloud)throw Error('cloud unavailable');await window.cloud.write({salt,...await encrypt(snapshot,key)});});return saveQueue}
function toast(msg){alert(msg)}
function statusOf(c){if(c.status==='تم الإنجاز')return 'done';if(hours(c.created)>Number(data.settings.lateHours||48))return 'late';if(c.status.includes('انتظار'))return 'wait';return 'active'}
function statusText(c){return statusOf(c)==='late'?'متأخرة':c.status}
function pill(c){return `<span class="pill ${statusOf(c)}">${esc(statusText(c))}</span>`}
function last(c){return c.history?.at(-1)?.text||'لا توجد تحديثات'}
function active(){return data.cases.filter(c=>c.status!=='تم الإنجاز')}
function filtered(archive=false){return data.cases.filter(c=>(archive?c.status==='تم الإنجاز':c.status!=='تم الإنجاز')&&(!filter||[c.name,c.mrn,c.phone,c.document,c.type].join(' ').toLowerCase().includes(filter.toLowerCase()))&&(!filterType||c.type===filterType)&&(!filterStatus||(filterStatus==='متأخرة'?statusOf(c)==='late':c.status===filterStatus))).sort((a,b)=>{let rank=c=>c.priority==='عاجلة جدًا'?0:c.priority==='عاجلة'?1:2;return rank(a)-rank(b)||new Date(b.created)-new Date(a.created)})}
function statMarkup(){let a=active(),late=a.filter(c=>statusOf(c)==='late').length;return `<div class="stats"><div class="stat blue">📋 إجمالي المعاملات<strong>${data.cases.length}</strong></div><div class="stat orange">⚠️ متأخرة<strong>${late}</strong></div><div class="stat purple">◷ تحت المتابعة<strong>${a.length}</strong></div><div class="stat green">✓ تم الإنجاز<strong>${data.cases.length-a.length}</strong></div></div>`}
function navMarkup(){let pages=[['home','⌂','الرئيسية'],['cases','☷','متابعة المعاملات'],['archive','▣','الأرشيف'],['reports','▥','التقارير والتصدير'],['settings','⚙','الإعدادات']];return pages.map(([id,ico,label])=>`<button class="nav ${current===id?'active':''}" data-nav="${id}"><span>${ico}</span>${label}</button>`).join('')}
function rowActions(c){return `<div class="actions"><button class="btn tiny" data-view="${c.id}">تفاصيل</button><button class="btn tiny secondary" data-edit="${c.id}">✎</button><button class="btn tiny gold" data-wa="${c.id}">واتساب</button>${c.status!=='تم الإنجاز'?`<button class="btn tiny" data-done="${c.id}">✓ إنجاز</button>`:''}</div>`}
function tableMarkup(cases){if(!cases.length)return `<div class="empty">لا توجد معاملات في هذا القسم حاليًا.</div>`;return `<div class="tablewrap"><table><thead><tr><th>المريض</th><th>MRN</th><th>نوع الطلب</th><th>المستند المطلوب</th><th>الأولوية</th><th>الحالة</th><th>تاريخ الإدخال</th><th>آخر إجراء</th><th>الإجراءات</th></tr></thead><tbody>${cases.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.mrn)}</td><td>${esc(c.type)}</td><td>${esc(c.document)}</td><td>${esc(c.priority)}</td><td>${pill(c)}</td><td>${fmt(c.created)}</td><td>${esc(last(c)).slice(0,90)}</td><td>${rowActions(c)}</td></tr>`).join('')}</tbody></table></div><div class="cards">${cases.map(c=>`<div class="casecard"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(c.name)}</h3>${pill(c)}</div><p class="muted">MRN: ${esc(c.mrn)} | ${esc(c.type)} | ${esc(c.priority)}</p><p>📄 ${esc(c.document)}</p><p class="muted">آخر إجراء: ${esc(last(c))}</p><p class="muted">${fmt(c.created)}</p>${rowActions(c)}</div>`).join('')}</div>`}
function filters(){return `<div class="toolbar"><input id="search" placeholder="بحث بالاسم أو رقم الملف أو الجوال أو المستند" value="${esc(filter)}" style="flex:2;min-width:180px"><select id="typeFilter" style="flex:1;min-width:140px"><option value="">جميع الأنواع</option>${['إدارية','طبية','حوادث وإصابات عمل'].map(x=>`<option ${filterType===x?'selected':''}>${x}</option>`).join('')}</select><select id="statusFilter" style="flex:1;min-width:130px"><option value="">جميع الحالات</option>${['تحت الإجراء','بانتظار رد التأمين','بانتظار القسم','متأخرة','تم الإنجاز'].map(x=>`<option ${filterStatus===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function home(){return `${statMarkup()}<section class="panel"><div class="toolbar" style="justify-content:space-between"><h2 style="margin:0">المعاملات غير المنجزة (${active().length})</h2><button class="btn" data-new>＋ إضافة معاملة جديدة</button></div>${filters()}<div id="list">${tableMarkup(filtered())}</div></section>`}
function casesPage(archive){return `${statMarkup()}<section class="panel"><h2>${archive?'أرشيف المعاملات المنجزة':'متابعة المعاملات النشطة'}</h2>${filters()}<div id="list">${tableMarkup(filtered(archive))}</div></section>`}
function chart(title,entries){let total=entries.reduce((s,x)=>s+x[1],0)||1;return `<section class="panel"><h2>${title}</h2>${entries.map(([k,n])=>`<div class="chartrow"><div><span>${esc(k)}</span><b>${n}</b></div><div class="chartbar"><span style="width:${100*n/total}%"></span></div></div>`).join('')}</section>`}
function reports(){let types=['إدارية','طبية','حوادث وإصابات عمل'].map(t=>[t,data.cases.filter(c=>c.type===t).length]),done=data.cases.filter(c=>c.status==='تم الإنجاز');let avg=done.length?(done.reduce((s,c)=>s+Math.max(0,(new Date(c.completed)-new Date(c.created))/36e5),0)/done.length).toFixed(1):'—';return `${statMarkup()}<div class="split">${chart('المعاملات حسب نوع الطلب',types)}${chart('المعاملات حسب الحالة',[['تحت الإجراء',data.cases.filter(c=>c.status==='تحت الإجراء').length],['بانتظار رد التأمين',data.cases.filter(c=>c.status==='بانتظار رد التأمين').length],['بانتظار القسم',data.cases.filter(c=>c.status==='بانتظار القسم').length],['تم الإنجاز',done.length]])}</div><section class="panel"><h2>مؤشرات الأداء</h2><p>متوسط زمن إنجاز المعاملة: <b>${avg==='—'?avg:avg+' ساعة'}</b></p><p>نسبة الإنجاز: <b>${data.cases.length?Math.round(done.length/data.cases.length*100):0}%</b></p><p class="muted">التأخر يُحسب من تاريخ إدخال المعاملة وفق الحد المحدد في الإعدادات.</p></section><section class="panel"><h2>تصدير Excel</h2><div class="formgrid"><div class="field"><label>نطاق التصدير</label><select id="exportScope"><option value="all">جميع المعاملات</option><option value="active">النشطة فقط</option><option value="done">المنجزة فقط</option><option value="filtered">النتائج المفلترة في صفحة المتابعة</option></select></div><div class="field"><label>من تاريخ</label><input type="date" id="fromDate"></div><div class="field"><label>إلى تاريخ</label><input type="date" id="toDate"></div><div class="field" style="justify-content:end"><button class="btn" id="exportExcel">⬇ تصدير تقرير Excel منسق</button></div></div><p class="muted">التقرير بصيغة Excel XML (.xls) ويشمل أوراق المعاملات والإحصائيات وسجل التحديثات. لا تُصدّر صور المرفقات.</p></section>`}
function settings(){return `<section class="panel"><h2>الإعدادات والأمان</h2><div class="notice">البيانات محفوظة مشفّرة في Firebase وتتزامن بين أجهزتك بعد تسجيل الدخول. المرفقات ضمن الخزنة المشفرة، وقد تتجاوز حدود حجم مستند Firestore (1 ميجابايت). لا تستخدم بيانات مرضى حقيقية دون موافقة جهة العمل وتقييم أمن المعلومات.</div><div class="formgrid"><div class="field"><label>تنبيه التأخير بعد (ساعة)</label><input type="number" min="1" max="720" id="lateHours" value="${Number(data.settings.lateHours||48)}"></div><div class="field" style="justify-content:end"><button class="btn" id="saveSettings">حفظ الإعدادات</button></div></div></section><section class="panel"><h2>النسخ الاحتياطي المشفر</h2><p>حمّل نسخة احتياطية مشفرة بكلمة مرور الخزنة نفسها، أو استعد نسخة سابقة. الاستعادة تستبدل البيانات الحالية بعد تأكيدك.</p><div class="toolbar"><button class="btn" id="backup">⬇ تنزيل نسخة احتياطية مشفرة</button><label class="btn secondary" for="restoreFile" style="cursor:pointer">⬆ استعادة نسخة</label><input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></div><p class="muted">احتفظ بكلمة المرور: لا يمكن استعادة البيانات بدونها. الحد الموصى به للمرفق 2 ميجابايت ولإجمالي الخزنة 12 ميجابايت.</p></section><section class="panel"><h2>قفل الخزنة</h2><button class="btn secondary" id="lock">قفل الآن</button></section>`}
function render(){if(!unlocked)return login();let content=current==='home'?home():current==='cases'?casesPage(false):current==='archive'?casesPage(true):current==='reports'?reports():settings();$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand">✚ KSAMC<small>مدينة الملك سلمان الطبية<br>تجمع المدينة المنورة الصحي</small></div>${navMarkup()}<button class="nav" data-new>＋ إضافة معاملة</button></aside><main class="main"><header class="top"><div><h1>نظام متابعة معاملات التأمين الطبي</h1><p>مدينة الملك سلمان الطبية | تجمع المدينة المنورة الصحي</p></div><div class="topactions"><button class="btn secondary" data-new>＋ طلب جديد</button><button class="btn secondary" id="lockTop">🔒</button></div></header><div class="content">${content}</div></main></div><button class="btn fab" data-new aria-label="إضافة معاملة">＋</button><nav class="mobilebar"><button data-nav="home" class="${current==='home'?'active':''}"><b>⌂</b>الرئيسية</button><button data-nav="cases" class="${current==='cases'?'active':''}"><b>☷</b>المعاملات</button><button data-new><b>＋</b>إضافة</button><button data-nav="archive" class="${current==='archive'?'active':''}"><b>▣</b>الأرشيف</button><button data-nav="reports" class="${current==='reports'?'active':''}"><b>▥</b>التقارير</button><button data-nav="settings"><b>⚙</b>المزيد</button></nav><div id="modalroot"></div>`;bindPage()}
function login(){unlocked=false;$('#root').innerHTML=`<div class="login"><div class="loginbox"><h1>🔒 خزنة معاملات KSAMC</h1><p>مزامنة مشفرة بين الماك والجوال</p><div class="notice">للتجربة ببيانات وهمية فقط. استخدم كلمة مرور الخزنة نفسها على الجهازين. لا يمكن استرجاعها إذا فقدتها.</div><form id="loginform"><div class="field"><label>كلمة مرور الخزنة (12 حرفًا على الأقل)</label><input type="password" id="pass" required minlength="12"></div><button class="btn" type="submit">فتح / إنشاء الخزنة</button></form><div id="loginerror" style="color:#b32c2c"></div></div></div>`;$('#loginform').onsubmit=async e=>{e.preventDefault();let pass=$('#pass').value;try{let rec=await window.cloud.read();if(rec){let k=await derive(pass,rec.salt),obj=await decrypt(rec,k);if(!Array.isArray(obj.cases))throw Error('invalid');key=k;salt=rec.salt;data=obj}else{salt=b64(crypto.getRandomValues(new Uint8Array(16)));key=await derive(pass,salt);data={cases:[],settings:{lateHours:48}};await persist()}unlocked=true;window.cloud.watch(async rec=>{if(!unlocked||!rec)return;try{await saveQueue;let obj=await decrypt(rec,key);if(Array.isArray(obj.cases)){data=obj;render()}}catch(e){console.warn('تعذر فك تحديث سحابي')}});render()}catch(err){$('#loginerror').textContent='تعذر فتح الخزنة. تحقق من كلمة المرور والاتصال بالإنترنت.'}}}

function formModal(id){let c=id?data.cases.find(x=>x.id===id):null;tempFiles=c?structuredClone(c.attachments||[]):[];modal(c?'تعديل بيانات المعاملة':'إضافة معاملة جديدة',`<form id="caseform"><div class="formgrid"><div class="field"><label>اسم المريض *</label><input name="name" maxlength="100" required value="${esc(c?.name||'')}"></div><div class="field"><label>رقم الملف الطبي MRN *</label><input name="mrn" maxlength="30" required value="${esc(c?.mrn||'')}"></div><div class="field"><label>رقم الجوال</label><input name="phone" inputmode="tel" maxlength="20" value="${esc(c?.phone||'')}"></div><div class="field"><label>نوع الطلب *</label><select name="type">${['إدارية','طبية','حوادث وإصابات عمل'].map(x=>`<option ${c?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field wide"><label>المستند المطلوب *</label><input name="document" maxlength="180" required value="${esc(c?.document||'')}"></div><div class="field"><label>الأولوية</label><select name="priority">${['عادية','عاجلة','عاجلة جدًا'].map(x=>`<option ${c?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>تاريخ استلام البريد</label><input type="datetime-local" name="emailDate" value="${esc(c?.emailDate||'')}"></div><div class="field wide"><label>الجهة المرسلة</label><input name="sender" maxlength="100" value="${esc(c?.sender||'')}"></div><div class="field wide"><label>حالة المعاملة</label><select name="status">${['تحت الإجراء','بانتظار رد التأمين','بانتظار القسم','تم الإنجاز'].map(x=>`<option ${c?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>${c?'ملاحظة تحديث جديدة (لا تُحذف الملاحظات القديمة)':'ملاحظات الطلب الأولية'}</label><textarea name="note" maxlength="3000" placeholder="اكتب الملاحظة..." ></textarea></div><div class="field full"><label>تصوير البريد الإلكتروني / إرفاق صورة أو PDF</label><input id="fileInput" type="file" accept="image/*,application/pdf" multiple><input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"><div class="toolbar"><button type="button" class="btn secondary tiny" id="cameraBtn">📷 تصوير بالكاميرا</button><span class="filehint">حتى 2 ميجابايت للمرفق؛ تُخزن المرفقات مشفرة في الخزنة المحلية.</span></div><div id="fileList"></div></div></div><div class="toolbar" style="justify-content:end;margin-top:18px"><button type="button" class="btn secondary" id="cancelForm">إلغاء</button><button type="submit" class="btn">💾 حفظ المعاملة</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#cameraBtn').onclick=()=>$('#cameraInput').click();$('#fileInput').onchange=handleFiles;$('#cameraInput').onchange=handleFiles;drawFiles();$('#caseform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),get=k=>String(f.get(k)||'').trim(),mrn=get('mrn'),documentName=get('document'),type=get('type');let duplicate=data.cases.find(x=>x.id!==id&&x.status!=='تم الإنجاز'&&x.mrn===mrn&&x.document.toLowerCase()===documentName.toLowerCase());if(duplicate&&!confirm('تنبيه: توجد معاملة نشطة بنفس رقم الملف والمستند المطلوب. هل تريد المتابعة رغم احتمال التكرار؟'))return;let status=get('status'),note=get('note'),ts=now();if(c){let oldStatus=c.status;Object.assign(c,{name:get('name'),mrn,phone:get('phone'),type,document:documentName,priority:get('priority'),emailDate:get('emailDate'),sender:get('sender'),status,attachments:structuredClone(tempFiles)});if(status==='تم الإنجاز'&&!c.completed)c.completed=ts;if(status!=='تم الإنجاز')c.completed=null;if(note||oldStatus!==status)c.history.push({at:ts,text:(oldStatus!==status?'تغيير الحالة من '+oldStatus+' إلى '+status+(note?' — ':''):'')+note});}else{data.cases.push({id:uuid(),name:get('name'),mrn,phone:get('phone'),type,document:documentName,priority:get('priority'),emailDate:get('emailDate'),sender:get('sender'),status,created:ts,completed:status==='تم الإنجاز'?ts:null,attachments:structuredClone(tempFiles),history:[{at:ts,text:note||'تم إنشاء المعاملة'}]})}try{await persist();closeModal();render();toast('تم حفظ المعاملة بنجاح')}catch(err){toast('تعذر حفظ البيانات. قد تكون مساحة المتصفح غير كافية. قلّل حجم المرفقات.')}}}
async function handleFiles(e){for(let file of [...e.target.files]){if(file.size>2*1024*1024){toast('المرفق أكبر من 2 ميجابايت: '+file.name);continue}if(!['image/jpeg','image/png','image/webp','image/heic','application/pdf'].includes(file.type)){toast('نوع الملف غير مدعوم: '+file.name);continue}let uri=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});tempFiles.push({id:uuid(),name:file.name,type:file.type,uri})}e.target.value='';drawFiles()}

function detail(id){let c=data.cases.find(x=>x.id===id);if(!c)return;modal('تفاصيل المعاملة',`<div class="formgrid"><div><b>المريض:</b> ${esc(c.name)}</div><div><b>MRN:</b> ${esc(c.mrn)}</div><div><b>الجوال:</b> ${esc(c.phone||'—')}</div><div><b>النوع:</b> ${esc(c.type)}</div><div><b>الأولوية:</b> ${esc(c.priority)}</div><div><b>الحالة:</b> ${pill(c)}</div><div class="wide"><b>المستند:</b> ${esc(c.document)}</div><div><b>الجهة المرسلة:</b> ${esc(c.sender||'—')}</div><div><b>تاريخ البريد:</b> ${esc(c.emailDate||'—')}</div></div><hr style="border:0;border-top:1px solid #e1e9ee;margin:18px 0"><h3>المرفقات (${(c.attachments||[]).length})</h3><div id="detailFiles">${(c.attachments||[]).map((f,i)=>`<div class="attachment">📎 ${esc(f.name)} <button class="btn tiny secondary" data-download="${i}">فتح / تنزيل</button></div>`).join('')||'<p class="muted">لا توجد مرفقات</p>'}</div><h3>سجل تحديثات المعاملة</h3><div class="timeline">${(c.history||[]).map(h=>`<div class="event"><small>${fmt(h.at)}</small><p>${esc(h.text)}</p></div>`).join('')}</div><div class="field"><label>إضافة تحديث جديد</label><textarea id="newUpdate" maxlength="3000" placeholder="اكتب ما تم اتخاذه..."></textarea></div><div class="toolbar" style="margin-top:12px"><button class="btn" id="addUpdate">＋ إضافة التحديث</button><button class="btn secondary" id="editFromDetail">تعديل بيانات المعاملة</button><button class="btn gold" id="waFromDetail">واتساب</button></div>`);document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>preview(c.attachments[Number(b.dataset.download)]));$('#addUpdate').onclick=async()=>{let t=$('#newUpdate').value.trim();if(!t)return toast('اكتب التحديث أولًا');c.history.push({at:now(),text:t});await persist();detail(id)};$('#editFromDetail').onclick=()=>formModal(id);$('#waFromDetail').onclick=()=>whatsapp(id)}

function whatsapp(id){let c=data.cases.find(x=>x.id===id);if(!c)return;modal('رسالة واتساب جاهزة',`<div class="notice">راجع نص الرسالة قبل الإرسال. لا تُرسل معلومات المريض أو رقم الملف الطبي إلا عبر قناة معتمدة وبموافقة جهة العمل.</div><div class="field"><label>القالب</label><select id="waTemplate"><option value="document">طلب استكمال مستند</option><option value="follow">متابعة طلب</option><option value="done">إشعار إتمام الطلب</option></select></div><div class="field" style="margin-top:12px"><label>الرسالة القابلة للتعديل</label><textarea id="waText" rows="5"></textarea></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="waOpen">فتح واتساب للمراجعة والإرسال</button><button class="btn secondary" id="waCopy">نسخ الرسالة</button></div>`);let msgs={document:'السلام عليكم، نأمل استكمال المستند المطلوب للمعاملة المشار إليها في مراسلاتنا السابقة. شاكرين تعاونكم.',follow:'السلام عليكم، نأمل التكرم بإفادتنا بآخر مستجدات المعاملة المشار إليها في مراسلاتنا السابقة. شكرًا لكم.',done:'السلام عليكم، نفيدكم بأنه تم استكمال الإجراء المتعلق بالمعاملة المشار إليها في مراسلاتنا السابقة. شكرًا لكم.'};function set(){ $('#waText').value=msgs[$('#waTemplate').value]}$('#waTemplate').onchange=set;set();$('#waCopy').onclick=()=>navigator.clipboard.writeText($('#waText').value).then(()=>toast('تم نسخ الرسالة')).catch(()=>toast('تعذر النسخ'));$('#waOpen').onclick=()=>{let phone=c.phone.replace(/\D/g,'');if(phone.startsWith('0'))phone='966'+phone.slice(1);if(!/^\d{9,15}$/.test(phone))return toast('رقم الجوال غير صالح. يمكنك نسخ الرسالة بدلًا من ذلك.');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent($('#waText').value),'_blank','noopener,noreferrer')}}

async function backup(){await saveQueue;let rec=await window.cloud.read();downloadBlob('KSAMC-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify({format:'KSAMC-VAULT-1',created:now(),payload:rec})],{type:'application/json'}))}
async function restore(e){let file=e.target.files[0];e.target.value='';if(!file)return;try{let backup=JSON.parse(await file.text());if(backup.format!=='KSAMC-VAULT-1'||!backup.payload?.cipher||!backup.payload?.salt||!backup.payload?.iv)throw Error('format');let p=prompt('أدخل كلمة مرور النسخة الاحتياطية لفحصها قبل الاستعادة:');if(p===null)return;let k=await derive(p,backup.payload.salt),obj=await decrypt(backup.payload,k);if(!Array.isArray(obj.cases))throw Error('data');if(!confirm('سيتم استبدال جميع المعاملات الحالية ببيانات النسخة الاحتياطية. هل أنت متأكد؟'))return;await saveQueue;await window.cloud.write(backup.payload);key=k;salt=backup.payload.salt;data=obj;render();toast('تمت الاستعادة بنجاح. كلمة مرور الخزنة الآن هي كلمة مرور النسخة المستعادة.')}catch(err){toast('فشلت الاستعادة: ملف غير صالح أو كلمة مرور غير صحيحة. لم تتغير البيانات الحالية.')}}

function exportExcel(){let scope=$('#exportScope').value,from=$('#fromDate').value,to=$('#toDate').value;if(from&&to&&from>to)return toast('تاريخ البداية بعد النهاية');let arr=data.cases.filter(c=>scope==='all'||scope==='active'&&c.status!=='تم الإنجاز'||scope==='done'&&c.status==='تم الإنجاز'||scope==='filtered'&&filtered(false).some(x=>x.id===c.id));arr=arr.filter(c=>(!from||c.created.slice(0,10)>=from)&&(!to||c.created.slice(0,10)<=to));let rows=arr.map((c,i)=>[i+1,c.name,c.mrn,c.phone,c.type,c.document,c.priority,statusText(c),c.sender||'',c.emailDate||'',fmt(c.created),fmt(c.completed),last(c),(c.attachments||[]).length]);let counts=[['المؤشر','القيمة'],['تاريخ إصدار التقرير',fmt(now())],['عدد المعاملات',arr.length],['المنجزة',arr.filter(c=>c.status==='تم الإنجاز').length],['النشطة',arr.filter(c=>c.status!=='تم الإنجاز').length],['المتأخرة',arr.filter(c=>statusOf(c)==='late').length],...['إدارية','طبية','حوادث وإصابات عمل'].map(t=>['نوع الطلب: '+t,arr.filter(c=>c.type===t).length])];let history=arr.flatMap(c=>(c.history||[]).map(h=>[c.mrn,c.name,c.type,fmt(h.at),h.text]));let xml=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel"><Styles><Style ss:ID="Default"><Alignment ss:Vertical="Center" ss:Horizontal="Right"/><Font ss:FontName="Tahoma" ss:Size="10"/></Style><Style ss:ID="head"><Font ss:FontName="Tahoma" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#00645E" ss:Pattern="Solid"/><Alignment ss:Horizontal="Right" ss:Vertical="Center"/></Style><Style ss:ID="text"><Interior ss:Color="#FFFFFF" ss:Pattern="Solid"/></Style><Style ss:ID="alternate"><Interior ss:Color="#EEF5F8" ss:Pattern="Solid"/></Style><Style ss:ID="index"><Font ss:Bold="1" ss:Color="#00645E"/></Style><Style ss:ID="done"><Interior ss:Color="#D9F6E5" ss:Pattern="Solid"/><Font ss:Color="#00613A"/></Style><Style ss:ID="late"><Interior ss:Color="#FFE1E1" ss:Pattern="Solid"/><Font ss:Color="#B32222"/></Style></Styles>${worksheet('المعاملات',['#','اسم المريض','MRN','رقم الجوال','نوع الطلب','المستند المطلوب','الأولوية','الحالة','الجهة المرسلة','تاريخ البريد','تاريخ الإدخال','تاريخ الإنجاز','آخر إجراء','عدد المرفقات'],rows,[45,180,95,115,150,180,95,120,150,135,135,135,260,100])}${worksheet('الإحصائيات',counts[0],counts.slice(1),[240,170])}${worksheet('سجل التحديثات',['MRN','اسم المريض','نوع الطلب','تاريخ التحديث','التحديث'],history,[100,180,150,160,450])}</Workbook>`;downloadBlob('KSAMC-report-'+new Date().toISOString().slice(0,10)+'.xls',new Blob(['\ufeff',xml],{type:'application/vnd.ms-excel;charset=utf-8'}));toast('تم تجهيز التقرير. قد يعرض Excel تحذيرًا لتوافق صيغة XML مع الامتداد xls؛ افتحه فقط إذا كان الملف صادرًا من هذا الموقع.')}
function authScreen(){ $('#root').innerHTML=`<div class="login"><div class="loginbox"><h1>KSAMC | تسجيل الدخول</h1><div class="notice">نسخة تجريبية ببيانات وهمية فقط. حساب Firebase الخاص بك مطلوب.</div><form id="authform"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>كلمة مرور Firebase</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">تسجيل الدخول</button></form><p id="autherror" style="color:#b32c2c"></p></div></div>`;$('#authform').onsubmit=async e=>{e.preventDefault();try{await window.cloud.signin($('#email').value,$('#password').value);login()}catch(err){$('#autherror').textContent='تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور وإعدادات Firebase.'}}}
